# Demo-only identity mapping. Role names are fictitious; no credentials here.
schema_version: 1
agents:
  - agent_ref: "agent:reviewer"
    source: "app/agent.py:reviewer"
    identity_ref: "aws:role/demo-review-agent"
mcp_servers:
  # The MCP server is a separate process with its own role.
  - source: "servers/storage_server.py"
    identity_ref: "aws:role/demo-storage-mcp"
identities:
  - id: "aws:role/demo-review-agent"
    provider: aws
    policies: ["policy/review-agent.json"]
  - id: "aws:role/demo-storage-mcp"
    provider: aws
    policies: ["policy/storage-mcp.json"]
