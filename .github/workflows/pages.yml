name: Deploy web UI to GitHub Pages

# Optional manual publication of the static single-page UI to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions".
#
# Pages serves static files only, so the deployed page has no API of its own:
# it checks for a backend on load and asks for one ("Analysis backend" field,
# remembered in the browser) when there is none. Run that backend with
# `aibom serve` or the Docker image, reachable over HTTPS with CORS allowing
# the Pages origin (AIBOM_CORS_ORIGINS). `?api=https://backend.example.com`
# preselects it in a shareable link.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
