name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          cache-suffix: py${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest --cov=aibom --cov-report=term-missing

  # Real-browser evidence for the features a reviewer can only judge by
  # looking: the dependency map and the web UI. Runs the same harness an agent
  # runs locally (scripts/verify.py); Playwright is installed here only, it is
  # not a project dependency. The evidence directory is uploaded either way.
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          cache-suffix: verify-ui

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install project and browser
        run: |
          uv pip install -e ".[dev]" playwright
          uv run playwright install --with-deps chromium

      - name: Verify dependency map and web UI
        run: uv run python scripts/verify.py --feature dependency-map --feature web-ui --no-gates

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: verify-out/
          retention-days: 14
